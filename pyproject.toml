[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom-local"
version = "0.2.0"
description = "A local-first AI Privacy Gateway for sanitizing sensitive information before AI use"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Cleanroom contributors"}]
keywords = ["privacy", "ollama", "pii", "sanitization", "local-first", "ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "PyMuPDF>=1.24,<2", "PyYAML>=6,<7", "sqlalchemy>=2.0,<3",
  "rich>=13,<16", "typer>=0.12,<1", "uvicorn>=0.30,<1", "watchdog>=5,<7",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "Pillow>=11,<13", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "types-PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/leoscha/Cleanroom"
Documentation = "https://github.com/leoscha/Cleanroom#readme"
Issues = "https://github.com/leoscha/Cleanroom/issues"
Repository = "https://github.com/leoscha/Cleanroom.git"

[project.scripts]
cleanroom = "cleanroom.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cleanroom.resources" = ["*.yaml", "*.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live_ollama: optional test requiring an explicitly enabled private Ollama endpoint"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cleanroom"]
plugins = ["pydantic.mypy"]
