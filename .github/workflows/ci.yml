name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python scripts/run_ci_tests.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Documentation links
        run: python scripts/check_markdown_links.py

  evaluation-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify generated corpus is current
        run: |
          python scripts/generate_evaluation_corpus.py --output /tmp/regression-corpus.jsonl
          diff src/cleanroom/resources/evaluation/cases/regression-corpus.jsonl /tmp/regression-corpus.jsonl
      - name: Deterministic release gate
        env:
          CLEANROOM_EVAL_MIN_PRECISION: "1.0"
          CLEANROOM_EVAL_MIN_REQUIRED_RECALL: "1.0"
          CLEANROOM_EVAL_MIN_EXACT_SPAN_ACCURACY: "0.95"
          OLLAMA_CONNECTION_MODE: local
          OLLAMA_BASE_URL: http://127.0.0.1:11434
        run: cleanroom evaluate --detector regex

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source archive
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/cleanroom-smoke"
          "${RUNNER_TEMP}/cleanroom-smoke/bin/pip" install dist/*.whl
          mkdir "${RUNNER_TEMP}/cleanroom-workspace"
          cd "${RUNNER_TEMP}/cleanroom-workspace"
          "${RUNNER_TEMP}/cleanroom-smoke/bin/cleanroom" init
          "${RUNNER_TEMP}/cleanroom-smoke/bin/cleanroom" version
          CLEANROOM_EVAL_MIN_PRECISION=1.0 \
            CLEANROOM_EVAL_MIN_REQUIRED_RECALL=1.0 \
            "${RUNNER_TEMP}/cleanroom-smoke/bin/cleanroom" evaluate --detector regex
